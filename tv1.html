<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Tacos – TV 1</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
  img { display: block; width: 100vw; height: 100vh; object-fit: fill; /* remplit tout l'écran, jamais de bande noire ni de rognage (déformation nulle sur une TV 16:9) */ }
</style>
</head>
<body>
<img id="menu" alt="">
<script>
  var IMAGE = 'images/menu1.webp';  // l'affiche de cette TV
  var RELOAD = 30 * 60 * 1000;      // recharge toutes les 30 min

  // Paramètre de version : change toutes les 30 min, donc la TV re-télécharge l'image à chaque recharge.
  document.getElementById('menu').src = IMAGE + '?v=' + Math.floor(Date.now() / RELOAD);

  // Ne recharge que si internet répond, sinon on garde l'affiche actuelle et on réessaie plus tard.
  setInterval(function () { if (navigator.onLine) location.reload(); }, RELOAD);
</script>
</body>
</html>
